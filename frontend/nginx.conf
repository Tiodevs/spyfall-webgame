# nginx do ambiente local (docker-compose.yml).
# Serve o build do Vite e repassa /socket.io e /api para o container "backend".
# Com tudo na mesma origem, o jogo funciona em localhost e pelo IP da rede
# (celulares no mesmo Wi-Fi) sem CORS e sem rebuild.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # DNS interno do Docker, resolvido a cada request: se o backend reiniciar
  # e trocar de IP, o nginx continua achando ele.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:3000;

  location /socket.io/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location /api/ {
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
